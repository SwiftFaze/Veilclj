name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          branch="${{ github.head_ref }}"
          if [[ "$branch" == release-please--branches--* ]]; then
            echo "Branch name '$branch' OK (Release Please's own branch, exempt)"
            exit 0
          fi
          if [[ "$branch" == "develop" ]]; then
            echo "Branch name '$branch' OK (develop promotion into master)"
            exit 0
          fi
          if [[ ! "$branch" =~ ^(fix|feat|feature|hotfix|chore|docs)/[a-zA-Z0-9._/-]+$ ]]; then
            echo "::error::Branch name '$branch' isn't allowed. Use one of: feat/, fix/, hotfix/, chore/, docs/ (docs/ only for doc-only changes), followed by a slug. (feature/ is also still accepted, for branches created before the feat/ convention.)"
            exit 1
          fi
          echo "Branch name '$branch' OK"

  master-source-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR source branch
        run: |
          branch="${{ github.head_ref }}"
          if [[ "$branch" == "develop" ]]; then
            echo "Branch '$branch' OK (develop promotion)"
            exit 0
          fi
          if [[ "$branch" == hotfix/* ]]; then
            echo "Branch '$branch' OK (hotfix)"
            exit 0
          fi
          if [[ "$branch" == "release-please--branches--master" ]]; then
            echo "Branch '$branch' OK (Release Please's own release branch)"
            exit 0
          fi
          echo "::error::PRs into master are only allowed from 'develop' (a release promotion) or 'hotfix/*' (got '$branch')."
          exit 1

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # bb is the project's command surface (bb.edn); its built-in `clojure`
      # launcher resolves deps.edn, so no separate Clojure CLI install is needed.
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          bb: 1.13.223

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: clj-${{ runner.os }}-

      - name: Unit specs
        run: bb spec

      - name: Runnable jar builds
        run: bb uber

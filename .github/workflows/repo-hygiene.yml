name: Repo hygiene

# Mechanises rules that were previously prose an agent had to remember.
# Every job here replaced a bullet in CLAUDE.md or .claude/workflow.md - see
# docs/instruction-files.md, "Rules that became tooling", which is the record of
# what moved so the same rule does not get re-added as prose later.

on:
  pull_request:
    branches: [master, develop]

jobs:
  # Was: .claude/workflow.md and CLAUDE.md growing without bound as one-off
  # fixes were appended. Budgets are tiered by how often a file is loaded.
  instruction-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check instruction file size budgets
        run: bash .claude/tools/check-instruction-budget.sh --verbose

  # Was: CLAUDE.md "Always put `Closes #N` in the PR body". This is load-bearing,
  # not cosmetic - GitHub's own auto-close never fires here because PRs merge into
  # develop rather than the default branch, so close-linked-issues.yml does it on
  # merge, but only if the reference is actually present.
  pr-body-closes-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Require "Closes #N" in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Release Please's own PRs and the develop -> master promotion carry no
          # single linked issue, by design.
          case "$HEAD_REF" in
            release-please--branches--*|develop)
              echo "Exempt branch '$HEAD_REF' - skipping."; exit 0 ;;
          esac

          if printf '%s' "$PR_BODY" | grep -qiE '\b(closes|fixes|resolves) +#[0-9]+'; then
            echo "Found an issue reference."
            exit 0
          fi

          echo "::error::PR body must contain 'Closes #N' (or Fixes/Resolves)."
          echo "GitHub will not auto-close the issue: this PR targets develop, not the"
          echo "default branch, so .github/workflows/close-linked-issues.yml does it on"
          echo "merge - and only if the reference is present. See CLAUDE.md."
          exit 1

  # Was: CLAUDE.md "Never hand-edit pom.xml's <version> or CHANGELOG.md".
  # Release Please derives both from Conventional Commits; a manual edit puts the
  # repo and the release tooling out of step.
  no-manual-release-edits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject hand-edits to the version or changelog
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$HEAD_REF" in
            release-please--branches--*|develop)
              echo "Exempt branch '$HEAD_REF' - skipping."; exit 0 ;;
          esac

          base="origin/$BASE_REF"
          status=0

          if ! git diff --quiet "$base"...HEAD -- CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md is generated by Release Please - do not hand-edit it (docs/release.md)."
            status=1
          fi

          # The project version sits at 4-space indentation; plugin and dependency
          # <version> tags are nested far deeper, so this matches only the former.
          if git diff "$base"...HEAD -- pom.xml | grep -qE '^[+-]    <version>'; then
            echo "::error file=pom.xml::pom.xml's project <version> is set by Release Please - do not hand-edit it (docs/release.md)."
            status=1
          fi

          [ "$status" -eq 0 ] && echo "No manual release edits found."
          exit $status

  # Was: docs/testing.md documenting the coverage/mutation-testing ratchet in
  # prose only (issue #196). Prose is not enforcement against the actor these
  # gates exist to constrain - see .claude/tools/check-quality-gates.sh.
  quality-gate-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for weakened coverage/mutation gates
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .claude/tools/check-quality-gates.sh

  # Not a rule that was ever prose: jqwik 1.10.0+ prints a fixed message aimed at
  # coding agents on every engine run (docs/testing-property-based.md). The text
  # is inert and the dependency is test-scope, so we keep the library - but a
  # release artifact that carries a payload aimed at automated consumers is worth
  # watching, and this fails the moment that payload is not what was audited.
  jqwik-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check jqwik's agent-directed output is unchanged
        run: bash .claude/tools/check-jqwik-canary.sh

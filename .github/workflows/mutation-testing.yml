name: Mutation testing

# Workflow Step 6 (.claude/workflow.md) is the check on the unit tests, which
# are not human-reviewed by design. It was manual-only, so nothing obliged
# anyone to run it - which is how a batch of assertion-free tests once cleared
# the 85% JaCoCo gate unnoticed (see issue #174).
#
# It runs weekly rather than per-PR because a full run takes minutes, not
# seconds: every mutant re-runs the matching tests, and here that includes the
# Cucumber suite. Weekly still surfaces a weak test within days of it landing,
# while the author's context is fresh, and taxes no PR.
#
# Deliberately does NOT fail the build even though pom.xml now carries a
# <mutationThreshold> (issue #196): that threshold gates the manual
# `mvn org.pitest:pitest-maven:mutationCoverage` command
# (pit-mutation-threshold.feature), not this scheduled job. Whether this job
# should also enforce it is an explicit follow-up, not decided here - see
# that feature file's Non-goals.

on:
  schedule:
    # Mondays 06:00 UTC. GitHub reads scheduled workflows from the default
    # branch (develop here), so this checks out develop by default - which is
    # what we want.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  mutation-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 21, not 17: Error Prone 2.50.0's plugin class needs a JDK 21+ host to
          # even load (crashes on 17 - see ci.yml's build-and-test job comment,
          # issue #199). Doesn't change the project's own 17 compile target.
          java-version: '21'
          cache: maven

      # test-compile explicitly: invoking the pitest goal standalone does not
      # run the earlier lifecycle phases, so on a fresh checkout there would be
      # no compiled classes to mutate. This also skips PMD/JaCoCo, which bind to
      # verify - so the pre-existing PMD violations in #173 cannot block this job.
      - name: Run mutation coverage
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: target/pit-reports/
          retention-days: 30
